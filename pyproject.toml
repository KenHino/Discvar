[project]
name = "discvar"
version = "0.0.3"
description = "Python implementation of discrete variable representation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=2.0.2",
    "scipy>=1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.2.5",
    "mypy>=2.1.0",
    "myst-parser>=4.0.0",
    "nbsphinx>=0.9.5",
    "pre-commit>=4.6.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.3",
    "ruff>=0.15.15",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.0.1",
]
